steps:
  - name: "build service context"
    type: script
    file: "$SERVICE_PATH/scripts/istio/build_service_context"
    configuration:
      SERVICE_OPERATION: apply
    output:
      - name: SERVICE_ID
        type: environment
      - name: SERVICE_SLUG
        type: environment
      - name: ACTION_ID
        type: environment
      - name: ACTION_NAME
        type: environment
      - name: K8S_NAMESPACE
        type: environment
      - name: DOMAIN_NAME
        type: environment
      - name: VISIBILITY
        type: environment
      - name: GATEWAY_NAME
        type: environment
      - name: AUTH_TYPE
        type: environment
      - name: COGNITO_USER_POOL_ARN
        type: environment
  - name: "validate domain"
    type: script
    file: "$SERVICE_PATH/scripts/istio/validate_domain"
  - name: "check domain dns"
    type: script
    file: "$SERVICE_PATH/scripts/istio/check_domain_dns"
  - name: "build request authentication"
    type: script
    file: "$SERVICE_PATH/scripts/istio/build_request_authentication"
  - name: apply
    type: script
    file: "$SERVICE_PATH/scripts/common/apply"
    configuration:
      ACTION: apply
      DRY_RUN: false
  - name: "store service results"
    type: script
    file: "$SERVICE_PATH/scripts/np/update_domain_service_results"
