steps:
  - name: "build link context"
    type: script
    file: "$SERVICE_PATH/scripts/istio/build_link_context"
    configuration:
      LINK_OPERATION: delete
    output:
      - name: LINK_ID
        type: environment
      - name: K8S_NAMESPACE
        type: environment
  - name: "delete link resources"
    type: script
    file: "$SERVICE_PATH/scripts/istio/delete_link_resources"
