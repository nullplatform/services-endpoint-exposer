steps:
  - name: "build service context"
    type: script
    file: "$SERVICE_PATH/scripts/istio/build_service_context"
    configuration:
      SERVICE_OPERATION: delete
    output:
      - name: SERVICE_ID
        type: environment
      - name: SERVICE_SLUG
        type: environment
      - name: K8S_NAMESPACE
        type: environment
      - name: AUTH_TYPE
        type: environment
      - name: COGNITO_USER_POOL_ARN
        type: environment
  - name: "check active links"
    type: script
    file: "$SERVICE_PATH/scripts/np/check_active_links"
  - name: "delete service resources"
    type: script
    file: "$SERVICE_PATH/scripts/istio/delete_service_resources"
  - name: "delete request authentication"
    type: script
    file: "$SERVICE_PATH/scripts/istio/delete_request_authentication"
