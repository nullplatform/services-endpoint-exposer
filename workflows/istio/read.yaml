steps:
  - name: "build service context"
    type: script
    file: "$SERVICE_PATH/scripts/istio/build_service_context"
    configuration:
      SERVICE_OPERATION: read
    output:
      - name: SERVICE_ID
        type: environment
      - name: K8S_NAMESPACE
        type: environment
  - name: read
    type: script
    file: "$SERVICE_PATH/scripts/istio/read_ingress"
